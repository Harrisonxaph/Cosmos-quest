name: CI and Pages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (navigation, panels, fallback, phone layout)
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log || {
            # Show which tests failed as an annotation on the pull request.
            echo "::error title=Browser tests failed::$(grep -E '✖|not ok|error:|expected:|actual:|location:' e2e.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
      - name: Install WebKit for the critical journeys
        run: npx playwright install --with-deps webkit
      - name: Critical journeys in WebKit (iPad emulation, not a real iPad)
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e:webkit 2>&1 | tee webkit.log || {
            echo "::error title=WebKit journeys failed::$(grep -E '✖|not ok|error:|expected:|actual:|location:' webkit.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
